name: Apply mobile icon logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-mobile-logo:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-logo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply mobile icon-only logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          style = Path('styles.css')
          css = style.read_text(encoding='utf-8')
          marker = '/* MOBILE ICON-ONLY BRAND */'
          if marker not in css:
              css += '''\n\n/* MOBILE ICON-ONLY BRAND */\n@media (max-width: 720px) {\n  .site-header .brand-logo {\n    width: 44px !important;\n    height: 44px !important;\n    background: url("assets_brand_icon.png") center/contain no-repeat !important;\n  }\n  .site-header .brand-logo img { display: none !important; }\n}\n'''
              style.write_text(css, encoding='utf-8')

          login = Path('login.html')
          text = login.read_text(encoding='utf-8')
          marker = '/* MOBILE ICON-ONLY LOGIN BRAND */'
          if marker not in text:
              text = text.replace('</head>', '''<style>/* MOBILE ICON-ONLY LOGIN BRAND */\n@media(max-width:720px){main>a:first-child{width:56px!important;height:56px!important;display:block;margin:0 auto 22px;background:url("assets_brand_icon.png") center/contain no-repeat}main>a:first-child img{display:none!important}}</style></head>''')
              login.write_text(text, encoding='utf-8')

          for name in ('dashboard.html', 'admin.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              marker = 'MOBILE ICON-ONLY PORTAL BRAND'
              if marker not in text:
                  text = text.replace('</style>', '''/* MOBILE ICON-ONLY PORTAL BRAND */\n@media(max-width:720px){.top>a{width:52px!important;height:52px!important;display:block;background:url("assets_brand_icon.png") center/contain no-repeat}.top>a .logo{display:none!important}}\n</style>''', 1)
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css login.html dashboard.html admin.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix mobile logo to icon only [mobile-logo-fix]"
          git push
