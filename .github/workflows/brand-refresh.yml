name: ANSHCODEX brand refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-brand:
    if: ${{ !contains(github.event.head_commit.message, '[brand-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace logo and add entrance animation
        shell: bash
        run: |
          cat > anshcodex-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d">
            <title id="t">ANSHCODEX</title>
            <desc id="d">ANSHCODEX logo with blue cyan monogram and wordmark.</desc>
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1f48ff"/>
                <stop offset="0.55" stop-color="#087dff"/>
                <stop offset="1" stop-color="#16d8ff"/>
              </linearGradient>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="8" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g transform="translate(28 24)">
              <path d="M15 208 104 32l78 142-36-2-40-74-40 110z" fill="url(#g)" filter="url(#glow)"/>
              <path d="M78 208c46-86 91-136 149-150-34 21-62 51-89 89 32-22 60-27 91-21-26 9-51 20-67 44 26 5 50 17 71 40-35-13-69-14-109-1z" fill="url(#g)" opacity=".98"/>
              <text x="242" y="124" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="#56a6ff">ANSH</text>
              <text x="507" y="124" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="800" letter-spacing="2" fill="#ffffff">CODEX</text>
              <text x="245" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="9" fill="#c8d6e8">MASTER THE CODE. OWN THE FUTURE</text>
              <rect x="245" y="198" width="210" height="4" rx="2" fill="#12d2ff"/>
              <rect x="468" y="198" width="80" height="4" rx="2" fill="#6e65ff"/>
            </g>
          </svg>
          SVG

          cat > anshcodex-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="ANSHCODEX icon">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f48ff"/><stop offset=".55" stop-color="#087dff"/><stop offset="1" stop-color="#16d8ff"/></linearGradient></defs>
            <path d="M16 206 104 28l78 142-36-2-40-74-40 110z" fill="url(#g)"/>
            <path d="M78 207c45-86 91-135 150-149-35 21-63 51-90 88 32-22 60-27 92-20-27 8-52 20-68 43 26 5 50 17 71 40-35-13-69-14-109-1z" fill="url(#g)"/>
          </svg>
          SVG

          cat >> styles.css <<'CSS'

          /* BRAND REFRESH */
          .site-header { min-height: 84px; }
          .site-header .brand-logo { width: 172px; height: 54px; display:flex; align-items:center; justify-content:flex-start; overflow:visible; }
          .site-header .brand-logo img { width: 172px !important; height:auto !important; max-height:54px; object-fit:contain; transform-origin:left center; animation: brandFloat 6s ease-in-out infinite; }
          .footer .brand-logo { width: 205px; }
          .footer .brand-logo img { width: 205px !important; height:auto !important; }
          @keyframes brandFloat { 0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)} }
          .page-intro { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#050b16; pointer-events:none; opacity:1; animation:introFade .95s ease .65s forwards; }
          .page-intro img { width:min(330px,62vw); filter:drop-shadow(0 18px 40px rgba(20,170,255,.22)); animation:introLogo .8s cubic-bezier(.2,.8,.2,1) forwards; }
          @keyframes introLogo { from{opacity:0;transform:translateY(16px) scale(.88);filter:blur(10px) drop-shadow(0 18px 40px rgba(20,170,255,.0))} to{opacity:1;transform:translateY(0) scale(1);filter:blur(0) drop-shadow(0 18px 40px rgba(20,170,255,.24))} }
          @keyframes introFade { to{opacity:0;visibility:hidden} }
          body.brand-ready .hero-copy, body.brand-ready .hero-card-wrap, body.brand-ready .section:not(.hero) { animation: contentRise .7s cubic-bezier(.2,.8,.2,1) both; }
          body.brand-ready .hero-copy { animation-delay:.1s; }
          body.brand-ready .hero-card-wrap { animation-delay:.18s; }
          @keyframes contentRise { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
          @media(max-width:720px){
            .site-header .brand-logo { width:48px !important; height:48px !important; background:url("anshcodex-icon.svg") center/contain no-repeat !important; }
            .site-header .brand-logo img { display:none !important; }
            .footer .brand-logo { width:70px !important; }
            .footer .brand-logo img { display:none !important; }
          }
          @media(prefers-reduced-motion:reduce){.site-header .brand-logo img,.page-intro,.page-intro img,body.brand-ready .hero-copy,body.brand-ready .hero-card-wrap,body.brand-ready .section:not(.hero){animation:none!important}}
          CSS

          cat >> script.js <<'JS'

          // Brand entrance animation
          (() => {
            const intro = document.createElement('div');
            intro.className = 'page-intro';
            intro.innerHTML = '<img src="anshcodex-logo.svg" alt="ANSHCODEX">';
            document.body.prepend(intro);
            requestAnimationFrame(() => document.body.classList.add('brand-ready'));
            setTimeout(() => intro.remove(), 1800);
          })();

          // Small click feedback for primary actions and navigation.
          document.addEventListener('click', (event) => {
            const link = event.target.closest('a,button');
            if (!link || link.classList.contains('menu-btn')) return;
            link.classList.remove('tap-pop');
            void link.offsetWidth;
            link.classList.add('tap-pop');
          });
          JS

          cat >> styles.css <<'CSS'
          .tap-pop { animation: tapPop .28s ease; }
          @keyframes tapPop { 0%{transform:scale(1)}50%{transform:scale(.97)}100%{transform:scale(1)} }
          CSS

          # Use the new brand on portal/login pages too.
          for name in login.html dashboard.html admin.html; do
            python - "$name" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          t=p.read_text(encoding='utf-8')
          t=t.replace('anshcodex-logo.svg','anshcodex-logo.svg')
          if 'BRAND REFRESH PORTAL' not in t:
              t=t.replace('</head>', '<style>/* BRAND REFRESH PORTAL */\n@media(max-width:720px){.logo{width:190px!important}.top>a{background:url("anshcodex-icon.svg") center/contain no-repeat!important}.top>a img{display:none!important}}\n.logo{width:190px!important;height:auto!important;object-fit:contain}\n</style></head>',1)
              p.write_text(t,encoding='utf-8')
          PY
          done

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anshcodex-logo.svg anshcodex-icon.svg styles.css script.js login.html dashboard.html admin.html
          git commit -m "Refresh logo sizing and add brand entrance animation [brand-refresh]" || exit 0
          git push
