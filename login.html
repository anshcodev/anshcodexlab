<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Login — ANSHCODEX LABS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><style>body{margin:0;min-height:100vh;background:#050b16;color:#f4f8ff;font:14px Inter,Arial,sans-serif;display:grid;place-items:center}main{width:min(440px,90vw)}img{width:220px;display:block;margin:0 auto 28px}.card{padding:28px;border:1px solid #1b2a40;border-radius:24px;background:#0a1628;box-shadow:0 25px 70px #0008}h1{font:700 40px Poppins,Arial;margin:10px 0}p{color:#93a3bb}.tabs{display:flex;gap:5px;padding:5px;background:#07111f;border-radius:12px;margin:20px 0}.tabs button{flex:1;padding:10px;border:0;border-radius:9px;background:transparent;color:#8193ab;font-weight:700}.tabs .on{background:#182943;color:#fff}form{display:grid;gap:12px}label{display:grid;gap:6px;color:#8193ab;font-size:11px;font-weight:700}input{padding:12px;border-radius:11px;border:1px solid #20314a;background:#071321;color:white}button.submit{padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#667cff,#42dfff);font-weight:800;cursor:pointer}.msg{min-height:20px;color:#75f4c2;font-size:12px}.back{display:block;text-align:center;color:#8fa2bb;margin-top:18px;text-decoration:none}.hide{display:none}</style><style>/* MOBILE ICON-ONLY LOGIN BRAND */
@media(max-width:720px){main>a:first-child{width:56px!important;height:56px!important;display:block;margin:0 auto 22px;background:url("assets_brand_icon.png") center/contain no-repeat}main>a:first-child img{display:none!important}}</style></head><body><main><a href="/"><img src="anshcodex-logo.svg" alt="ANSHCODEX LABS"></a><section class="card"><small>CLIENT PORTAL</small><h1 id="title">Welcome back.</h1><p id="sub">Login to your ANSHCODEX project portal.</p><div class="tabs"><button id="loginTab" class="on">Login</button><button id="signupTab">Create account</button></div><form id="form"><label id="nameLabel" class="hide">Full name<input id="name"></label><label id="companyLabel" class="hide">Company<input id="company"></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="submit" id="submit">Login</button><div class="msg" id="msg"></div></form><a class="back" href="/">← Back to website</a></section></main><script>let signup=false;const $=id=>document.getElementById(id);function mode(v){signup=v;$('loginTab').classList.toggle('on',!v);$('signupTab').classList.toggle('on',v);$('nameLabel').classList.toggle('hide',!v);$('companyLabel').classList.toggle('hide',!v);$('title').textContent=v?'Create your account.':'Welcome back.';$('sub').textContent=v?'Create your customer portal account.':'Login to your ANSHCODEX project portal.';$('submit').textContent=v?'Create account':'Login';$('msg').textContent=''}$('loginTab').onclick=()=>mode(false);$('signupTab').onclick=()=>mode(true);$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Please wait...';if(signup){const {data,error}=await supabaseClient.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{full_name:$('name').value,company:$('company').value}}});if(error){$('msg').textContent=error.message;return}$('msg').textContent=data.session?'Account created.':'Account created. Check your email, then log in.'}else{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('msg').textContent=error.message;return}const p=await getProfile(data.user.id);location.href=p&&p.role==='admin'?'admin.html':'dashboard.html'}};</script></body></html>
